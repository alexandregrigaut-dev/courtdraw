# Stray typo'd URL picking up Search Console impressions with no matching
# page — catch it rather than let it 404, since some inbound link/query
# apparently expects it.
[[redirects]]
  from = "/american-factory-tactics-board"
  to   = "/american-football-tactics-board/"
  status = 301

# Redirect direct .html access to canonical clean URLs (prevents duplicate indexing)
[[redirects]]
  from = "/community.html"
  to   = "/community"
  status = 301

[[redirects]]
  from = "/privacy.html"
  to   = "/privacy"
  status = 301

[[redirects]]
  from = "/terms.html"
  to   = "/terms"
  status = 301

# Clean URL rewrites (serve .html files at clean paths)
[[redirects]]
  from = "/privacy"
  to   = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to   = "/terms.html"
  status = 200

[[redirects]]
  from = "/cookies"
  to   = "/privacy"
  status = 301

[[redirects]]
  from = "/app"
  to   = "/courtdraw-app.html"
  status = 200

[[redirects]]
  from = "/community"
  to   = "/community.html"
  status = 200

[[redirects]]
  from = "/c/:username"
  to   = "/profile.html?u=:username"
  status = 200

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Embeddable board widget: this is the ONLY path allowed to be framed by
# other sites. Content-Security-Policy's frame-ancestors directive takes
# precedence over X-Frame-Options in every modern browser (per the CSP
# spec), so this scoped exception is honoured for /embed.html alone while
# the site-wide X-Frame-Options: DENY set above stays untouched — everywhere
# else keeps failing closed even if a browser doesn't support CSP framing
# control. embed.html itself has no authenticated or state-changing
# capability, so there is nothing on this path for a clickjacking attack
# to target.
[[headers]]
  for = "/embed.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
